<div class="relative">
  <div class="relative">
    <span
      class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant pointer-events-none">search</span>
    @if (selectedOption()) {
      <button type="button" (click)="clear()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    }
    <input type="text" [value]="query()" (input)="onInputInput($any($event.target).value)"
      (focus)="onInputFocus()" [placeholder]="placeholder()" [disabled]="disabled()"
      [class.border-error]="hasError()" [class.focus:border-error]="hasError()"
      class="block w-full rounded-lg bg-surface-container-low border text-on-surface placeholder-on-surface-variant transition-colors duration-200 text-body-base focus:outline-none h-10 !pl-10 !pr-10 border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary" />
  </div>

  @if (isOpen() && !disabled()) {
    <div
      class="absolute z-50 top-full mt-1 w-full rounded-lg bg-surface-container-high border border-outline-variant shadow-lg overflow-hidden fade-in">
      @if (filteredOptions().length === 0) {
        <div class="px-3 py-2 text-body-sm text-on-surface-variant text-center">
          No universities found
        </div>
      }
      @for (option of filteredOptions(); track option.value; let i = $index) {
        <button type="button" (click)="selectOption(option)"
          [class.bg-surface-container-highest]="i === activeIndex()"
          [class.text-on-surface]="i === activeIndex()"
          class="w-full text-left px-3 py-2.5 text-body-sm text-on-surface-variant hover:bg-surface-container-highest hover:text-on-surface transition-colors flex flex-col gap-0.5">
          <span class="text-body-base text-on-surface">{{ option.label }}</span>
          @if (option.subtitle) {
            <span class="text-body-sm text-on-surface-variant">{{ option.subtitle }}</span>
          }
        </button>
      }
    </div>
  }
</div>
