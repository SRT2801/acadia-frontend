<div class="fixed inset-0 linear-gradient-bg pointer-events-none"></div>
<div class="fixed top-0 left-1/4 w-px h-full bg-surface-container-high/20"></div>
<div class="fixed top-0 right-1/4 w-px h-full bg-surface-container-high/20"></div>

<main class="relative z-10 w-full max-w-100 px-md mx-auto flex-1 flex flex-col justify-center">
  <app-card>
    <app-card-header>
      <div
        class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-container-high border border-surface-container-highest">
        <app-logo />
      </div>
      <h1 class="text-headline-md text-on-surface m-0">Acadia</h1>
      <span class="text-label-caps text-on-surface-variant">Academic Workspace</span>
    </app-card-header>

    <app-card-content>
      @if (state() === 'form') {
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="fade-in flex flex-col gap-md">
          <div class="flex flex-col gap-xs">
            <label for="email" class="text-body-sm text-on-surface">Email Address</label>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant pointer-events-none">mail</span>
              <input id="email" type="email" ui-input [hasError]="isFieldInvalid('email')" [iconLeft]="true"
                formControlName="email" autocomplete="email" placeholder="john@university.edu" />
            </div>
          </div>

          <button type="submit" ui-button [disabled]="forgotForm.invalid || isSubmitting()" class="mt-sm">
            {{ isSubmitting() ? 'Sending...' : 'Send reset link' }}
            @if (!isSubmitting()) {
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            }
          </button>

          <div class="text-center text-body-sm text-on-surface-variant">
            <a routerLink="/login" class="inline-flex items-center gap-1 text-primary hover:text-primary-fixed-dim transition-colors">
              <span class="material-symbols-outlined text-[16px]">arrow_back</span>
              Back to login
            </a>
          </div>
        </form>
      }

      @if (state() === 'success') {
        <div class="fade-in flex flex-col items-center text-center py-lg">
          <div
            class="w-12 h-12 rounded-full bg-secondary-container/20 border border-secondary flex items-center justify-center mb-lg">
            <span class="material-symbols-outlined text-secondary text-[24px]">check_circle</span>
          </div>
          <h2 class="text-headline-md text-on-surface mb-xs">Check your email</h2>
          <p class="text-body-sm text-on-surface-variant mb-xl">
            If that email exists, we've sent a reset link to your inbox.
          </p>
          <button ui-button class="w-full mt-sm" routerLink="/login">
            Return to login
          </button>
        </div>
      }
    </app-card-content>
  </app-card>

  <div class="mt-lg text-center">
    <p class="text-body-sm text-on-surface-variant">
      Acadia Platform &copy; 2026
    </p>
  </div>
</main>
