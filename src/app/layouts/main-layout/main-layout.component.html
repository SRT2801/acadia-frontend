<div class="h-dvh w-full flex overflow-hidden bg-background">
  @if (isSidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/30 lg:hidden" (click)="isSidebarOpen.set(false)"></div>
  }
  <app-sidebar [(isOpen)]="isSidebarOpen" />

  <div class="flex-1 flex flex-col min-w-0">
    <header
      class="h-14 shrink-0 flex items-center gap-md px-lg border-b border-outline-variant bg-surface-container-low">
      <button type="button" (click)="toggleSidebar()"
        class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors -ml-1">
        <span class="material-symbols-outlined text-[20px]">menu</span>
      </button>
      <div class="flex-1 flex items-center gap-md">
        <div class="relative flex-1 max-w-120">
          <span
            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant pointer-events-none">search</span>
          <input type="text" placeholder="Search..."
            class="w-full h-9 rounded-lg bg-surface-container-high border border-outline-variant text-on-surface placeholder-on-surface-variant text-body-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary !pl-9 !pr-3" />
        </div>
      </div>
      <button type="button"
        class="w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined text-[20px]">notifications</span>
      </button>
      <button type="button"
        class="w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors">
        <span class="material-symbols-outlined text-[20px]">settings</span>
      </button>
      <div class="flex items-center gap-2 pl-sm border-l border-outline-variant">
        <div
          class="w-8 h-8 rounded-full bg-primary-container/20 border border-primary flex items-center justify-center text-body-sm text-on-surface font-medium">
          JD
        </div>
        <div class="flex flex-col">
          <span class="text-body-sm text-on-surface leading-tight">John Doe</span>
          <span class="text-label-caps text-on-surface-variant leading-tight">ADMIN</span>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
