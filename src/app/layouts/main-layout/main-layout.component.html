<div class="h-dvh w-full flex overflow-hidden">
  @if (isSidebarOpen()) {
  <div class="fixed inset-0 z-40 bg-black/30 lg:hidden" (click)="isSidebarOpen.set(false)"></div>
  }
  @if (!isInCourse()) {
  <app-sidebar [(isOpen)]="isSidebarOpen" [navItems]="navItems" />
  }

  <div class="flex-1 flex flex-col min-w-0">
    <header
      class="h-14 shrink-0 flex items-center gap-md px-lg border-b border-outline-variant bg-surface-container-low">
      <button type="button" (click)="toggleSidebar()"
        class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors -ml-1">
        <span class="material-symbols-outlined text-[20px]">menu</span>
      </button>

      @if (isInCourse()) {
        <div class="flex items-center gap-3">
          <app-logo />
          <span class="text-body-base font-semibold text-on-surface">Acadia Workspace</span>
        </div>
      }

      <div class="flex-1"></div>
      <app-notification-panel />
      <button type="button" (click)="toggleThemeMenu()"
        class="w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors relative">
        <span class="material-symbols-outlined text-[20px]">settings</span>
      </button>

      <!-- Theme Dropdown -->
      @if (showThemeMenu()) {
        <div class="absolute right-lg top-14 z-50 bg-surface-card border border-border-card rounded-xl shadow-xl overflow-hidden min-w-40">
          <div class="p-xs">
            <p class="text-label-caps text-on-surface-variant px-sm py-xs">Tema</p>
            <button (click)="setTheme('dark')"
              class="w-full flex items-center gap-sm px-sm py-xs rounded-lg text-body-sm text-on-surface hover:bg-surface-container-low transition-colors"
              [class.bg-surface-container-low]="theme() === 'dark'">
              <span class="material-symbols-outlined text-lg">dark_mode</span>
              <span class="flex-1 text-left">Modo Oscuro</span>
              @if (theme() === 'dark') {
                <span class="material-symbols-outlined text-primary text-sm">check</span>
              }
            </button>
            <button (click)="setTheme('light')"
              class="w-full flex items-center gap-sm px-sm py-xs rounded-lg text-body-sm text-on-surface hover:bg-surface-container-low transition-colors"
              [class.bg-surface-container-low]="theme() === 'light'">
              <span class="material-symbols-outlined text-lg">light_mode</span>
              <span class="flex-1 text-left">Modo Claro</span>
              @if (theme() === 'light') {
                <span class="material-symbols-outlined text-primary text-sm">check</span>
              }
            </button>
          </div>
        </div>
        <div class="fixed inset-0 z-40" (click)="closeThemeMenu()"></div>
      }
      <div class="flex items-center gap-2 pl-sm border-l border-outline-variant">
        <div
          class="w-8 h-8 rounded-full bg-primary-container/20 border border-primary flex items-center justify-center text-body-sm text-on-surface font-medium">
          {{ initials() }}
        </div>
        <div class="flex flex-col">
          <span class="text-body-sm text-on-surface leading-tight">{{ displayName() }}</span>
          <span class="text-label-caps text-on-surface-variant leading-tight">{{ displayRole() }}</span>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
    <app-notification-toast />
  </div>
</div>
