<div class="fixed inset-0 linear-gradient-bg pointer-events-none"></div>
<div class="fixed top-0 left-1/4 w-px h-full bg-surface-container-high/20"></div>
<div class="fixed top-0 right-1/4 w-px h-full bg-surface-container-high/20"></div>

<main class="relative z-10 w-full max-w-100 px-md mx-auto flex-1 flex flex-col justify-center">
  <app-card>
    <app-card-header>
      <div
        class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-container-high border border-surface-container-highest">
        <app-logo />
      </div>
      <h1 class="text-headline-md text-on-surface m-0">Acadia</h1>
      <span class="text-label-caps text-on-surface-variant">Academic Workspace</span>
    </app-card-header>

    <app-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-md">
        <div class="flex flex-col gap-xs">
          <label for="email" class="text-body-sm text-on-surface">Email Address</label>
          <input id="email" type="email" ui-input [hasError]="isFieldInvalid('email')" formControlName="email"
            autocomplete="email" />
        </div>

        <div class="flex flex-col gap-xs">
          <div class="flex items-center justify-between">
            <label for="password" class="text-body-sm text-on-surface">Password</label>
            <a routerLink="/forgot-password" class="text-body-sm text-primary hover:text-primary-fixed-dim transition-colors">Forgot
              password?</a>
          </div>
          <div class="relative">
            <input id="password" [type]="showPassword() ? 'text' : 'password'" ui-input
              [hasError]="isFieldInvalid('password')" [iconRight]="true" formControlName="password"
              autocomplete="current-password" />
            <button type="button" (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex">
              <span class="material-symbols-outlined text-[18px]">
                {{ showPassword() ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button type="submit" ui-button [disabled]="loginForm.invalid || isSubmitting()" class="mt-sm">
          {{ isSubmitting() ? 'Logging in...' : 'Login' }}
          @if (!isSubmitting()) {
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          }
        </button>

        <div class="text-center text-body-sm text-on-surface-variant">
          Don't have an account?
          <a routerLink="/register" class="text-primary hover:text-primary-fixed-dim transition-colors">Register</a>
        </div>
      </form>
    </app-card-content>
  </app-card>
</main>
