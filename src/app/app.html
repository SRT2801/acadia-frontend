<div class="fixed inset-0 square-grid-bg pointer-events-none z-[-1]"></div>

<div class="h-dvh w-full flex flex-col overflow-hidden relative">
  <div
    class="flex-1 flex flex-col [&>*:not(router-outlet)]:flex-1 [&>*:not(router-outlet)]:flex [&>*:not(router-outlet)]:flex-col overflow-y-auto">
    <router-outlet />
  </div>
  @if (showFooter()) {
    <app-card-footer class="shrink-0"></app-card-footer>
  }
</div>

<ngx-spinner name="primary" [bdColor]="'rgba(15,15,15,0.85)'" [color]="'#4fc3f7'" [size]="'medium'" [type]="'ball-scale-multiple'">
</ngx-spinner>
